spring:
  application:
    name: cardigan
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas:
      - user_service
      - board_service
    locations:
      - classpath:db/migration/user
      - classpath:db/migration/board
  threads:
    virtual:
      enabled: true
  mvc:
    formcontent:
      filter:
        # FormContentFilter runs before security and buffers form bodies without a size limit.
        enabled: false
  servlet:
    multipart:
      # Tomcat parses multipart parts from its own buffer, past the request size limit filter.
      enabled: false

cardigan:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
  web:
    max-request-body-size: 256KB
  board:
    # How long a write waits for the row lock of its board before it fails with a 500.
    lock-timeout: 5s

springdoc:
  api-docs:
    enabled: false
    version: openapi_3_0
  # Error responses are documented by CardiganOpenApiCustomizer, not taken from the exception handlers.
  override-with-generic-response: false
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
