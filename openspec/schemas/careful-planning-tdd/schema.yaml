name: careful-planning-tdd
version: 1
description: Interview-first, test-first workflow - decisions → proposal → specs → design → tests → tasks. Applied with separate test-writer and implementer agents. Only for changes that add or change production code with behavior a test can observe; everything else uses careful-planning.
artifacts:
  - id: decisions
    generates: decisions.md
    description: Decisions settled by interviewing the user before any planning is written
    template: decisions.md
    instruction: |
      Run the careful-planning skill for this change. The skill interviews the user
      in rounds with the AskUserQuestion tool, looks up facts itself, and
      writes decisions.md only after the user has confirmed the shared
      understanding. Do not write the file by hand and do not answer questions
      on the user's behalf. If the careful-planning skill is not available, stop
      and tell the user instead of writing decisions.md yourself.

      This workflow leads to real implementation work, so the interview
      settles both the behavior and contract decisions and the technical
      decisions the design and tasks depend on. Make sure the decisions cover
      what the later artifacts need: whether the change is breaking, the
      observable behavior, inputs, outputs and error conditions the specs will
      describe, and the technical choices the design must not guess at (for
      example data model, module boundaries, new dependencies or
      infrastructure). Anything left open goes under Deferred with the
      artifact it must be settled before.

      **Is test-first worth it for this change?** The test-first workflow
      costs a blind test plan, three agents and a test-writer that never
      sees the code. That only pays off when the change has scenarios a test
      can observe. Add this question to the first round of the interview,
      always, as the first question of that round. Record the answer as the
      `Workflow` line of decisions.md. The two choices:

      - **Test-first** (`careful-planning-tdd`): the change adds or changes
        production code with behavior a test can observe. Config or build work
        inside such a change is fine; it becomes `[plain]` tasks.
      - **Plain** (`careful-planning`): nothing a new test could observe, such
        as build config, dependency bumps, CI, documentation, tooling, or a
        refactor that existing tests already cover.

      Ask it with AskUserQuestion, even when the answer looks obvious:

      - The question names the change and asks whether to use test-first.
      - Two options, Test-first and Plain. The recommended one comes first,
        with "(Recommended)" in its label and a one-line reason in its
        description that names what in this change would be tested, or why
        nothing would be.
      - Say in the question that the user can pick "Other" to give more
        context: which parts of the change get test-first and which don't.

      If the answer limits test-first to some parts, record both lists in
      the `Workflow` line ("test-first for ...; not for ..."). The
      test-designer plans tests only for the test-first parts, and the rest
      becomes `[plain]` tasks.

      For Plain, set `schema: careful-planning` in the change's
      `.openspec.yaml` before writing the next artifact, and continue with
      that schema's instructions (`openspec instructions` picks it up).
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Base the proposal on decisions.md. Do not introduce behavior that
      contradicts it or that it does not cover; if something is missing,
      stop and run the careful-planning skill again for the open point.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires:
      - decisions

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Base the specs on the proposal and decisions.md. Do not introduce behavior that
      contradicts decisions.md or that it does not cover; if something is
      missing, stop and run the careful-planning skill again for the open point.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Do not rewrite
        an existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions in ADDED requirements and in the main spec. This is a warning: normal validation still passes, but `openspec validate --strict` fails on it. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length. Split an existing long requirement only when the user asks for it, in a change made for that purpose: under MODIFIED, keep its header and every scenario and cut its description down to one behavior without changing its meaning, then add each behavior you removed as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      Base the design on decisions.md, the proposal and the specs. Every
      technical choice decisions.md settles must appear here as decided; do
      not reopen or contradict it. If the design needs a decision that
      decisions.md does not cover and that would change the approach, the
      specs, or the task breakdown, stop and run the careful-planning skill again
      for that point instead of picking a default.

      **Test-first.** In this schema the design is always written. It names
      the public surface that component tests are written against before any
      implementation exists: every new or changed type, interface, function
      signature, data shape and UI component with its inputs, plus the errors
      each one raises. Name them as precisely as a test needs to call them.
      Anything the design leaves unnamed can only be tested through the
      acceptance level.

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - specs

  - id: tests
    generates: tests.md
    description: Test plan derived only from the contract - the planning artifacts - by an agent that never sees implementation code
    template: tests.md
    instruction: |
      Do not write tests.md yourself. The session that wrote the specs and
      the design reads its own wording as intended, so its test plan inherits
      its blind spots. Start the `tdd-test-designer` subagent with the Agent
      tool and this prompt, with the placeholders filled in and absolute paths:

      ```
      Write the test plan for the OpenSpec change `<change-id>`.
      Change root: <changeRoot>
      Template: <path of this schema's templates/tests.md>
      Inputs: decisions.md, proposal.md, design.md and every file under
      specs/ in the change root, the main specs they
      modify under openspec/specs/, openspec/config.yaml,
      .claude/tdd/project.md and the project rules it lists, and any specs
      from other stores the proposal references (fetch them with
      `openspec show <spec-id> --type spec --store <store>`).
      ```

      Pass nothing else: no summary of the change, no opinion on what to
      test. When the subagent returns:

      - Check that tests.md exists and that its Coverage table lists every
        scenario of every ADDED or MODIFIED requirement in the delta specs.
        If one is missing, resume the same subagent (SendMessage) and name
        the missing scenarios. Do not add tests yourself.
      - If tests.md has open questions, show them to the user. Each one is a
        behavior the artifacts do not decide. Settle them with the user,
        then update the artifact that should have decided it (the spec, or
        the design for a technical choice), and resume the subagent to
        replace the open question with tests. Never answer an open question
        by picking the tested behavior yourself.
      - If tests.md has no `A` and no `C` tests, or only a handful that
        restate what existing tests already cover, the change has nothing
        for the test-first workflow to do. Stop and ask the user whether to
        switch it to `careful-planning` (set `schema: careful-planning` in
        `.openspec.yaml`, delete tests.md, update the `Workflow` line). Do
        not write tasks.md for this schema first.

      What tests.md is for: the test-writer agent builds tests from it
      during apply without seeing the implementation, and the implementer
      makes them pass without being allowed to change them. A test in the
      plan that asserts something no artifact states is a bug in the plan.
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation checklist split into scaffold, red (tests) and green (implementation) steps per group, with an owner role for every task
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Base the tasks on decisions.md, the specs, design.md and tests.md. Do
      not add work that decisions.md lists as out of scope, and do not
      schedule a decision that decisions.md marks as deferred to
      implementation without a task that settles it with the user first.

      Before writing tasks, check the design for open questions and tests.md
      for open questions. If any of them would change what gets built or
      tested, resolve them with the user first. Do not bake an unstated
      assumption into the task list.

      **IMPORTANT: Follow the template below for tracked tasks.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Guidelines:
      - Group related tracked tasks under ## numbered headings
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Track implementation and verification work that can be completed before
        archive. If the requested workflow includes archive or work that requires
        this change to be archived, preserve those steps as plain bullets in an
        optional `## Workflow follow-up` section at the end of tasks.md. These
        bullets are reference information outside tracked task progress.
      - Documentation a group's work calls for lands in that group, as
        `[plain]` tasks, not in a final group.

      ## Roles

      Apply runs the change with three agents, each started once: an
      implementer does all setup and scaffold tasks, one test-writer then
      writes the tests of every red task, and the same implementer, resumed,
      does all remaining tasks group by group. The role tag that directly
      follows the task number says which batch a task belongs to. Every
      tracked task MUST carry exactly one tag:

      - `[scaffold]` - implementer, setup batch. Creates the public surface
        the group's tests compile against: the types, interfaces, signatures,
        data shapes and components the design names, with the stub bodies
        `.claude/tdd/project.md` names. No logic. All scaffold tasks of the
        change run together, before any test is written.
      - `[red]` - test-writer. Writes the listed tests.md IDs as test code,
        including fakes, fixtures and changes to test infrastructure. Its
        tests form one bundle, parked outside the source tree until the
        group's first `[green]` task. The test-writer never sees any
        implementation of the change, because none exists yet.
      - `[green]` - implementer. Activates the group's bundle and makes its
        tests pass. May not change any test file.
      - `[plain]` - implementer. Work with no tests of its own: dependencies,
        configuration, documentation, regenerated files, manual checks.
        Plain tasks before the first `[red]` task run in the setup batch.
      - `[acceptance-red]` - test-writer. Writes all acceptance tests (the
        `A` IDs of tests.md). They form one bundle, parked until the
        `[acceptance-green]` task.
      - `[acceptance-green]` - implementer. Activates the acceptance bundle
        and makes it pass.
      - `[adversary]` - optional, at most one, in its own group before the
        final integration group. Runs mutation testing (when the project has
        it) and a white-box adversarial pass over the finished change; the
        implementer commits its passing tests and fixes the bugs it finds.
        Add it for changes where a missed edge case is expensive
        (authentication, data integrity, concurrency, money); leave it out
        for routine work.

      ## Group layout

      - Group 1 is always `## 1. Acceptance tests` with one `[acceptance-red]`
        task that lists every `A` ID. Leave it out only when tests.md has no
        `A` IDs.
      - Every following group that owns `C` IDs runs in this order:
        optional `[scaffold]`, then `[red]`, then one or more `[green]`.
        A group's `[red]` task lists exactly the `C` IDs the group's `[green]`
        tasks make pass. Every `C` ID appears in exactly one `[red]` task.
      - Groups without tests use only `[plain]` tasks.
      - Exactly one task, in the group that completes the surface the
        acceptance tests use, is `[acceptance-green]`. Put it after that
        group's `[green]` tasks.
      - The optional `[adversary]` group comes right before the last group.
      - The last group is for integration checks only (`openspec validate`,
        the full check from project.md, project rules), as `[plain]` tasks.

      ## Writing the tasks

      - Each tracked task MUST be a checkbox: `- [ ] X.Y [role] Task description`.
      - `[red]` and `[acceptance-red]` tasks name the tests.md IDs and say
        where the tests go (area and test file or class). They do not restate
        the test cases; tests.md is the source.
      - `[green]` tasks name what to implement and end with "Verify with the
        tests of X.Y passing" plus anything the tests cannot show.
      - `[scaffold]` and `[plain]` tasks state how to verify completion (a
        command, an observable result, or a delivered artifact).
      - Do NOT collect tests into a final group. Each group's tests are
        written in that group's `[red]` task.

      Example:

          # Tasks

          ## 1. Acceptance tests

          - [ ] 1.1 [acceptance-red] Write A01-A12 from tests.md as <acceptance test file> in <area>.

          ## 2. Setup

          - [ ] 2.1 [plain] Add <dependency>. Verify with <command>.

          ## 3. <Unit>

          - [ ] 3.1 [scaffold] Add <signature> in <area> with a stub body. Verify with <compile or type-check command>.
          - [ ] 3.2 [red] Write C01-C09 from tests.md as <test file> in <area>.
          - [ ] 3.3 [green] Implement <unit> as the design describes. Verify with the tests of 3.2 passing.
          - [ ] 3.4 [acceptance-green] Make the acceptance tests of 1.1 pass. Verify with <command> passing.

          ## 4. Integration

          - [ ] 4.1 [plain] Run `openspec validate <change-id>` and the full check. Verify both pass.

      When applicable, append workflow follow-up as plain bullets, for example:
      ```
      ## Workflow follow-up

      - Archive the change after the project's review requirements are satisfied.
      - Verify the archived result.
      ```

      Reference specs for what needs to be built, design for how to build it,
      and tests.md for what is tested.
    requires:
      - specs
      - design
      - tests


apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    This schema separates the agent that writes tests from the agent that
    writes the implementation. Apply the change in this session, but only as
    a coordinator: run the `openspec-apply-tdd` skill with this change id and
    follow it. It starts one tdd-implementer for the setup and scaffold
    tasks, one tdd-test-writer for all [red] and [acceptance-red] tasks, and
    resumes the implementer for the rest, group by group; it checks the test
    files after every phase, settles disputes, and runs the optional
    [adversary] task. Do not write tests or production code in this session
    yourself.

    If you are a sub-agent (no Agent tool), stop and report that this change
    has to be applied from the main session. If the openspec-apply-tdd skill
    is not available, stop and tell the user instead of applying the change
    yourself.
