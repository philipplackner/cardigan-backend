schema: careful-planning

references:
  - id: cardigan-shared-specs
    remote: https://github.com/philipplackner/cardigan-specs.git

context: |
  Cardigan is built as three products in separate repos: this backend, a mobile app
  (Android and iOS), and a web frontend.
  Product behavior shared across all three is specified in the
  cardigan-shared-specs reference. Read it before planning a change, and
  don't restate it here.
  Specs in this repo cover only what is specific to the backend.

rules:
  proposal:
    - List every shared-spec requirement this change implements or depends on with its spec ID and requirement name
  specs:
    - Never copy a shared requirement into this repo, but reference by spec ID and requirement name
    - Only specify behavior that differs per platform or exists only on backend

operations:
  archive:
    guidance:
      - Before applying the delta, read this change's created date from .openspec.yaml. Find every change in openspec/changes/archive/ whose date prefix is on or after that date.
      - For each capability in this change's delta, collect its requirement names from ADDED, MODIFIED, REMOVED and RENAMED (both old and new names). Do the same for those archived changes.
      - If a name appears in both, another change touched that requirement after this one was written. Do not write anything yet. Show the archived change's version, the current main spec and this change's delta, propose a merged delta, and ask the user to confirm or choose. If the edits contradict each other, ask which behavior wins.
